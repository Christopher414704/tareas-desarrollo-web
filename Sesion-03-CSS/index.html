<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Productos — Tarea CSS</title>
    <!-- Link del archivo de los estilos.-->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Contenedor de la Galeria de Productos-->

    <main class="container">
        <h1>Galería de Productos</h1>

        <!--Contenedor de la Galeria de Productos-->
        <section class="galeria">

            <!-- Contenedor del Producto y sus Propiedades-->
            <article class="producto">
                <img src="imagenes/PCGAMER1.jpeg" alt="Producto 1">
                <!-- Contenedor que Contiene el Producto-->
                <div class="producto-info">
                    <h2>Computadora GAMER RYZEN 5</h2>
                    <!-- Propiedad de Boton y Precio-->
                    <p class="precio">Q5999.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://ishop.gt/cdn/shop/files/IMG-18277928_m_jpeg_1_1befeccb-70fb-421b-a546-7ce573927949.jpg?v=1760536947&width=823" alt="Producto 2">
                <!-- Contenedor que Contiene el Producto-->
                <div class="producto-info">
                    <h2>Macbook Pro Apple Silicon</h2>
                      <!-- Propiedad de Boton y Precio-->
                    <p class="precio">Q10999.99</p>
                    
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://img.pacifiko.com/PROD/resize/1/1000x1000/ZjZkZmE3Nz_378.png" alt="Producto 3">
                <!-- Contenedor que Contiene el Producto-->
                <div class="producto-info">
                    <h2>Camara GO PRO</h2>
                    <!-- Propiedad de Boton y Precio-->
                    <p class="precio">Q899.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://m.media-amazon.com/images/I/71sgAr9atBS._AC_SL1500_.jpg" alt="Producto 4">
                <!-- Contenedor que Contiene el Producto-->
                <div class="producto-info">
                    <h2>Laptop Gamer ASUS TUF GAMING</h2>
                    <!-- Propiedad de Boton y Precio-->
                    <p class="precio">Q12999.00</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://intech.com.gt/sU/files/articulos/1719527700.png" alt="Producto 5">
                <!-- Contenedor que Contiene el Producto-->
                <div class="producto-info">
                    <h2>Mouse Gamer RAZER</h2>
                    <!-- Propiedad de Boton y Precio-->
                    <p class="precio">Q649.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://mimarket.micoope.com.gt/wp-content/uploads/2022/01/teclado-GK100F-1.png" alt="Producto 6">
                <!-- Contenedor que Contiene el Producto-->
                <div class="producto-info">
                    <h2>Teclado Gamer HP</h2>
                    <!-- Propiedad de Boton y Precio-->
                    <p class="precio">Q499.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

        </section>

        <!-- Contenedor de la Lista-->
        <section class="todo-list">
            <h2>To-Do List</h2>
            <!-- Opciones de la Lista-->
            <ul class="tareas" role="list">
                <!-- Utilizar LI Y INPUT-->
                <li class="tarea">
                    <input type="checkbox" id="t1">
                    <label for="t1">Aprender CSS Grid</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t2">
                    <label for="t2">Practicar Flexbox</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t3">
                    <label for="t3">Estudiar diseño responsivo</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t4">
                    <label for="t4">Hacer la tarea de CSS</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t5">
                    <label for="t5">Revisar novedades de CSS 2024</label>
                </li>
            </ul>
        </section>
    </main>

</body>
</html>
